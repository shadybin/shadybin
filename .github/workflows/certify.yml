# The certification a vendor runs on its own Actions minutes and Claude API key. A vendor
# calls it from its release workflow, after the release is published:
#
#   certify:
#     needs: release
#     permissions: { contents: write, id-token: write, attestations: write }
#     uses: shadybin/shadybin/.github/workflows/certify.yml@v1
#     with: { tag: "${{ github.ref_name }}" }
#     secrets: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
#
# v1 moves to each compatible release, so a vendor never has to update this; a vendor
# that would rather review each update pins an exact release (v1.2.3, or its commit) and
# lets Dependabot bump it. Only a change to the inputs, the secrets or the permissions
# above is a v2.
#
# plan reads how to rebuild the project from the registry's shadybin.json, not the
# vendor's repository. rebuild runs each of its builds on that build's own runner, since a
# macOS binary may need macOS. certify compares what was rebuilt with what was published,
# records what the code can do, has Claude review the code the vendor controls and the
# third-party code that is new or changed, writes the statement and report, attests them
# with this workflow's identity and attaches them to the release. The vendor runs it but
# cannot change what it does: the attestation names this file and commit
# (job_workflow_ref), and the registry's intake accepts only the commits shadybin has
# released, listed in its .github/certify-commits. The registry signs; this never does.
name: certify

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to certify.
        type: string
        required: true
    secrets:
      ANTHROPIC_API_KEY:
        description: The vendor's Claude API key, which pays for its reviews.
        required: true

permissions: {}

env:
  TAG: ${{ inputs.tag }}
  # The registry repository itself, read raw: certify only reads it, and the repository is
  # the record, so this needs no DNS and no Pages build to have caught up.
  REGISTRY: https://raw.githubusercontent.com/shadybin/registry/main
  # shadybin's public keys, hex, comma-separated: cached reviews must be signed by one.
  SHADYBIN_KEYS: d971638b671326b3831fb6962e0da516593a1af317b29521651bdf02bb2ed8fc

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      # The shadybin that rebuilds, reviews and attests is the one at this workflow
      # file's own commit: the commit the vendor pinned, and the one the attestation
      # names. Building it from a branch would let it change under a pinned caller.
      - name: Resolve this workflow's own commit
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # An empty value would make checkout fall back to the caller's repository.
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository/job.workflow_sha unavailable; refusing to build an unpinned shadybin"
            exit 1
          fi
          echo "building shadybin from $WORKFLOW_REPOSITORY@$WORKFLOW_SHA"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: shadybin
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: shadybin/go.mod
          cache: false

      # shadybin is pure Go: one build per runner kind the project's builds use.
      - name: Build shadybin
        run: |
          mkdir -p sb
          for os in linux darwin; do for arch in amd64 arm64; do
            (cd shadybin && CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o "../sb/shadybin-$os-$arch" ./cmd/shadybin)
          done; done

      - name: Plan the builds
        id: plan
        run: |
          repo="github.com/${GITHUB_REPOSITORY,,}"
          curl -fsSL "$REGISTRY/$repo/shadybin.json" -o sb/shadybin.json
          echo "builds=$(jq -c '[.builds | to_entries[] | {index: .key, runner: .value.runner,
            go: (.value.toolchain.go // ""), zig: (.value.toolchain.zig // ""), rust: (.value.toolchain.rust // "")}]' sb/shadybin.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shadybin
          path: sb/

  rebuild:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.plan.outputs.builds) }}
    # GitHub-hosted only: a self-hosted runner is the vendor's own machine. The attestation
    # records the runner kind, and intake refuses self-hosted.
    runs-on: ${{ matrix.build.runner }}
    permissions:
      contents: read
    steps:
      # The tag at the workspace root, where the vendor's release job builds it: compilers
      # can embed the source's path.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: shadybin
          path: ${{ runner.temp }}/sb

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: matrix.build.go != ''
        with:
          go-version-file: ${{ matrix.build.go == 'go.mod' && 'go.mod' || '' }}
          go-version: ${{ matrix.build.go != 'go.mod' && matrix.build.go || '' }}
          cache: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: matrix.build.zig != ''
        with:
          version: ${{ matrix.build.zig }}

      - name: Install Rust
        if: matrix.build.rust != ''
        env:
          RUST: ${{ matrix.build.rust }}
        run: |
          if [ "$RUST" = rust-toolchain.toml ]; then rustup show active-toolchain || rustup toolchain install
          else rustup toolchain install "$RUST" --profile minimal && rustup default "$RUST"; fi

      - name: Rebuild
        env:
          INDEX: ${{ matrix.build.index }}
        run: |
          sb="$RUNNER_TEMP/sb"
          os=$(uname -s | tr A-Z a-z); arch=$(uname -m); [ "$arch" = x86_64 ] && arch=amd64; [ "$arch" = aarch64 ] && arch=arm64
          chmod +x "$sb/shadybin-$os-$arch"
          "$sb/shadybin-$os-$arch" rebuild -project "$sb/shadybin.json" -build "$INDEX" -tag "$TAG" -src . -out "$RUNNER_TEMP/rebuilt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rebuilt-${{ matrix.build.index }}
          path: ${{ runner.temp }}/rebuilt/

  certify:
    needs: rebuild
    runs-on: ubuntu-24.04
    permissions:
      contents: write # attach the statement and report to the release
      id-token: write # Sigstore identity for the attestation
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: shadybin
          path: ${{ runner.temp }}/sb

      # Every job in the vendor's workflow run shares its artifacts, so a job of the vendor's
      # own could add a rebuilt-<anything> artifact holding the published files. Only the
      # rebuild jobs' own artifacts, rebuilt-0 to rebuilt-<n-1>, are taken, and any other
      # fails the run. A vendor's job cannot take one of those names first without the rebuild
      # job's upload failing.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: rebuilt-*
          path: ${{ runner.temp }}/rebuilt-artifacts

      - name: Set up
        run: |
          sb="$RUNNER_TEMP/sb"; chmod +x "$sb/shadybin-linux-amd64"
          echo "SB=$sb/shadybin-linux-amd64" >> "$GITHUB_ENV"
          echo "PROJECT=$sb/shadybin.json" >> "$GITHUB_ENV"
          echo "WORK=$RUNNER_TEMP/work" >> "$GITHUB_ENV"; mkdir -p "$RUNNER_TEMP/work"
          echo "REPO=github.com/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "LANGUAGE=$(jq -r .language "$sb/shadybin.json")" >> "$GITHUB_ENV"
          echo "ZIG=$(jq -r '[.builds[].toolchain.zig // empty][0] // ""' "$sb/shadybin.json")" >> "$GITHUB_ENV"
          echo "RUST=$(jq -r '[.builds[].toolchain.rust // empty][0] // ""' "$sb/shadybin.json")" >> "$GITHUB_ENV"
          builds=$(jq '.builds | length' "$sb/shadybin.json")
          mkdir -p "$RUNNER_TEMP/rebuilt"
          for d in "$RUNNER_TEMP"/rebuilt-artifacts/*; do
            n=$(basename "$d"); i=${n#rebuilt-}
            if ! [[ "$i" =~ ^[0-9]+$ ]] || [ "$i" -ge "$builds" ]; then
              echo "::error::artifact $n was not made by a rebuild job of this workflow"; exit 1
            fi
          done
          for i in $(seq 0 $((builds - 1))); do
            d="$RUNNER_TEMP/rebuilt-artifacts/rebuilt-$i"
            [ -d "$d" ] || { echo "::error::rebuild $i left no artifact"; exit 1; }
            for f in "$d"/*; do
              n=$(basename "$f")
              [ ! -e "$RUNNER_TEMP/rebuilt/$n" ] || { echo "::error::two rebuilds made $n"; exit 1; }
              mv "$f" "$RUNNER_TEMP/rebuilt/$n"
            done
          done

      # The analysis reads the code the way its language's tools do.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: env.LANGUAGE == 'go'
        with:
          go-version-file: go.mod
          cache: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: env.LANGUAGE == 'zig'
        with:
          version: ${{ env.ZIG }}
      # The analysis only reads the crate graph, so it needs no toolchain of the vendor's
      # choosing, and must not take one: rust-toolchain.toml can name a toolchain at a path
      # in the repository, whose cargo would be the vendor's program, run in this job.
      - name: Install Rust
        if: env.LANGUAGE == 'rust'
        run: |
          t=stable
          case "$RUST" in ""|rust-toolchain.toml) ;; *) t=$RUST ;; esac
          RUSTUP_TOOLCHAIN=$t rustup toolchain install "$t" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$t" >> "$GITHUB_ENV"

      - name: Compare with the published release
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$(jq -r .checksums "$PROJECT")" -D "$WORK/published"
          cat "$WORK"/published/* > "$WORK/published-checksums.txt"
          # The published archives too: one whose bytes differ from the rebuild's still
          # matches if it installs the same files, only its times and owners differing.
          mkdir -p "$WORK/published-files"
          for f in "$RUNNER_TEMP"/rebuilt/*; do
            n=$(basename "$f")
            case "$n" in *.tar.gz|*.tgz|*.zip) gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$n" -D "$WORK/published-files" || true ;; esac
          done
          set +e
          table=$("$SB" compare -published "$WORK/published-checksums.txt" -published-files "$WORK/published-files" "$RUNNER_TEMP/rebuilt")
          code=$?
          set -e
          {
            echo "# $REPO $TAG"
            echo
            echo "## Rebuild"
            echo
            echo "Rebuilt from tag \`$TAG\` ($(git rev-parse HEAD)) and compared with the published checksums."
            echo
            echo "$table"
          } > "$WORK/rebuild.md"
          cat "$WORK/rebuild.md" >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Record what the code can do
        run: |
          "$SB" manifest -project "$PROJECT" -src . -o "$WORK/manifest.json"
          # The base is the last certified release; with none, everything is reviewed whole.
          prev=$(curl -fsS "$REGISTRY/$REPO/latest" || true)
          if [[ "$prev" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]] &&
            curl -fsSL "$REGISTRY/$REPO/$prev/manifest.json" -o "$WORK/previous-manifest.json"; then
            PREVIOUS_ARGS="-previous $WORK/previous-manifest.json -previous-tag $prev"
            echo "PREVIOUS_ARGS=$PREVIOUS_ARGS" >> "$GITHUB_ENV"
          fi
          "$SB" capabilities $PREVIOUS_ARGS "$WORK/manifest.json" > "$WORK/capabilities.md"

      - name: Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cache=()
          if [ -n "$SHADYBIN_KEYS" ]; then cache=(-cache "$REGISTRY" -cache-key "$SHADYBIN_KEYS"); fi
          "$SB" review -project "$PROJECT" -src . -manifest "$WORK/manifest.json" $PREVIOUS_ARGS \
            "${cache[@]}" -o "$WORK/review.json" > "$WORK/review.md"
          { cat "$WORK/rebuild.md"; echo; cat "$WORK/capabilities.md"; echo; cat "$WORK/review.md"; } > "$WORK/report.md"
          cat "$WORK/review.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Write the statement
        run: |
          "$SB" statement -registry "$WORK/bundle" -repo "$REPO" -tag "$TAG" -published "$WORK/published-checksums.txt" -published-files "$WORK/published-files" \
            -report "$WORK/report.md" -manifest "$WORK/manifest.json" -review "$WORK/review.json" "$RUNNER_TEMP/rebuilt"
          dir="$WORK/bundle/$REPO/$TAG"
          mkdir -p "$WORK/out"
          cp "$dir/statement.txt" "$WORK/out/shadybin-statement.txt"
          cp "$dir/report.md" "$WORK/out/shadybin-report.md"
          cp "$dir/manifest.json" "$WORK/out/shadybin-manifest.json"
          cp "$dir/review.json" "$WORK/out/shadybin-review.json"

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.WORK }}/out/shadybin-*

      # Intake reads the four files from the release, or from this artifact when the
      # release cannot take them. Either way it trusts only the attestations, never where
      # the files came from.
      - name: Keep the files with this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shadybin-${{ env.TAG }}
          path: ${{ env.WORK }}/out/shadybin-*
          if-no-files-found: error

      # An immutable release (GitHub's setting) refuses new assets once published, so a
      # certification of one lives in the artifact above instead.
      - name: Attach to the release
        run: |
          if [ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isImmutable -q .isImmutable)" = true ]; then
            echo "::notice::$TAG is an immutable release; the certification is kept in the run's shadybin-$TAG artifact for intake"
            exit 0
          fi
          gh release upload "$TAG" "$WORK"/out/shadybin-* --clobber -R "$GITHUB_REPOSITORY"
