# make check on every push and pull request: every language, every test, the vectors in
# sync. Toolchains are the ones the SDKs promise to support at their oldest.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      # Running the TypeScript tests directly needs Node's type stripping.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - run: rustup component add rustfmt clippy
      - run: make check

  # A sealed rebuild on real runners, the way certify's rebuild job runs one: the same
  # bytes for a clean project, something else for a build that ships a file the review
  # left out, and no network or sudo for the build.
  sealed-rebuild:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go build -o bin/shadybin ./cmd/shadybin
      - run: bash .github/certify/test-sealed-rebuild.sh bin/shadybin

  # The Swift SDK uses CryptoKit, which is Apple's, so it is tested on macOS, with the
  # oldest Xcode it supports (Swift 6.0).
  swift-sdk:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Select Xcode 16.0
        run: |
          dir=/Applications/Xcode_16.0.app/Contents/Developer
          if [ ! -d "$dir" ]; then echo "Xcode 16.0 is not on this runner; it has:"; ls -d /Applications/Xcode_*.app; exit 1; fi
          echo "DEVELOPER_DIR=$dir" >> "$GITHUB_ENV"
      - run: make sdk-swift
