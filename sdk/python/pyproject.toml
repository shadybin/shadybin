[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shadybin-verify"
version = "0.1.0"
description = "Verify shadybin statements: that a release was rebuilt from its tagged source and passed review"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["supply-chain", "reproducible-builds", "verification", "updater"]

[project.urls]
Homepage = "https://shadybin.dev"
Source = "https://github.com/shadybin/shadybin"

[tool.setuptools.packages.find]
where = ["src"]
