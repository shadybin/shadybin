[package]
name = "shadybin-verify"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Verify shadybin statements: that a release was rebuilt from its tagged source and passed review"
license = "MIT"
repository = "https://github.com/shadybin/shadybin"
keywords = ["supply-chain", "reproducible-builds", "verification", "updater"]
categories = ["cryptography"]

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2", default-features = false }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
